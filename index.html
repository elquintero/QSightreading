function applyTheme() {
  Object.assign(AC, S.skin === 1 ? THEME_DARK : THEME_LIGHT);

}
const accA = (a) => rgbaHex(AC.accV, a);                           // el acento con transparencia (resaltes)

const S = {
mode: 0,
lg: 1,
lf: 1,
visible: 6,
es: true,
sound: true,
piano: true,
vol: 7,
haptic: true,
midi: true,
skin: 0,
accent: 0,
klv: [0, 0],
adapt: true,

function loadSettings() {
try {

  S.klv    = [0, 1].map((i) => clamp(int(Array.isArray(raw.klv) ? raw.klv[i] : 0, 0), 0, KEY_LEVELS.length - 1));

S.lf = clamp(int(raw.lf !== undefined ? raw.lf : raw.above, 1), 0, 4);

const bottomStep = (c) => (c === 1 ? BOTTOM_FA : BOTTOM_SOL);

let ctx = cv.getContext("2d");
let L = {};

const cs = getComputedStyle(document.getElementById("safe"));

t: parseFloat(cs.paddingTop) || 0,    r: parseFloat(cs.paddingRight) || 0,
b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0

}
const SZ = [0.8, 1, 1.25, 1.5], SZ_NAME = ["Pequeño", "Normal", "Grande", "Muy grande"];

    for (const s of melList) if (!cats.some((c) => c.id === s.cat)) { const d = DEF[s.cat]; cats.push({ id: s.cat, nombre: d ? d[0] : s.cat.charAt(0).toUpperCase() + s.cat.slice(1), icono: s.cat === "otras" ? "nota" : s.cat, desc: d ? d[1] : "", color: "" }); }

/* ---------- .mxl = ZIP con el MusicXML dentro ---------- */
async function unzipEntry(buf, wanted) {
  if (typeof DecompressionStream === "undefined") throw new Error("este navegador no puede abrir .mxl");
  const dv = new DataView(buf), u8 = new Uint8Array(buf), ents = [];
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65600); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("no es un .mxl válido");
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  for (let k = 0; k < n && dv.getUint32(p, true) === 0x02014b50; k++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    ents.push({ name: new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl)), method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), lho: dv.getUint32(p + 42, true) });
    p += 46 + nl + el + cl;
  }
  const read = async (en) => {
    const start = en.lho + 30 + dv.getUint16(en.lho + 26, true) + dv.getUint16(en.lho + 28, true), data = u8.subarray(start, start + en.csize);
    if (en.method === 0) return new TextDecoder().decode(data);
    if (en.method !== 8) throw new Error("compresión no admitida");
    const st = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new TextDecoder().decode(await new Response(st).arrayBuffer());
  };
  return wanted(ents, read);
}
async function xmlFromMxl(buf) {
  return unzipEntry(buf, async (ents, read) => {
    const find = (nm) => ents.find((x) => x.name.toLowerCase() === nm.toLowerCase());
    let path = "";
    const c = find("META-INF/container.xml");
    if (c) { const m = /full-path="([^"]+)"/.exec(await read(c)); if (m) path = m[1]; }
    let en = path ? find(path) : null;
    if (!en) en = ents.find((x) => !/^META-INF\//i.test(x.name) && /\.(xml|musicxml)$/i.test(x.name));
    if (!en) throw new Error("el .mxl no contiene partitura");
    return read(en);
  });
}

/* ---------- MusicXML (partwise): se lee la voz en clave de sol ---------- */
function parseMusicXML(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("fichero MusicXML no válido");
  if (doc.documentElement.nodeName !== "score-partwise") throw new Error("solo se admite MusicXML «partwise»");
  const tx = (el, tag) => { const x = el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ""; };
  let bpm = 0;
  for (const s of doc.getElementsByTagName("sound")) { const t = parseFloat(s.getAttribute("tempo")); if (t > 0) { bpm = t; break; } }
  if (!bpm) { const pm = parseFloat(tx(doc, "per-minute")); if (pm > 0) bpm = pm; }
  const STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  for (const part of doc.getElementsByTagName("part")) {
    let sign = "";
    for (const c of part.getElementsByTagName("clef")) { const nn = c.getAttribute("number"); if (!nn || nn === "1") { sign = tx(c, "sign"); break; } }
    if (sign && sign !== "G") continue;                    // de momento solo clave de sol
    let div = 1, voice = null;
    const notes = [];
    for (const meas of part.children) {
      if (meas.nodeName !== "measure") continue;
      for (const el of meas.children) {
        if (el.nodeName === "attributes") { const d = parseFloat(tx(el, "divisions")); if (d > 0) div = d; continue; }
        if (el.nodeName !== "note" || el.getElementsByTagName("grace").length || el.getElementsByTagName("rest").length) continue;
        const st = tx(el, "staff");
        if (st && st !== "1") continue;
        const pe = el.getElementsByTagName("pitch")[0];
        if (!pe || STEP[tx(pe, "step")] === undefined) continue;
        const v = tx(el, "voice") || "1";
        if (voice === null) voice = v;
        if (v !== voice) continue;
        const step = (parseInt(tx(pe, "octave"), 10) - 4) * 7 + STEP[tx(pe, "step")];
        const alt = Math.sign(parseFloat(tx(pe, "alter")) || 0);
        const beats = (parseFloat(tx(el, "duration")) || div) / div;
        const last = notes[notes.length - 1];
        if (el.getElementsByTagName("chord").length) { if (last && step > last.step) { last.step = step; last.alt = alt; } continue; }   // acordes: la nota más aguda
        let tieStop = false;
        for (const t of el.getElementsByTagName("tie")) if (t.getAttribute("type") === "stop") tieStop = true;
        if (tieStop && last && last.step === step) { last.beats += beats; continue; }                                                   // ligadura: suma duración
        notes.push({ step, beats, alt });
      }
    }
    if (notes.length) return { title: tx(doc, "work-title") || tx(doc, "movement-title"), bpm: bpm || 90, notes };
  }
  throw new Error("no se encontró ninguna voz en clave de sol");
}
async function readSong(entry) {
  const r = await fetch(MEL_DIR + entry.archivo);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const buf = await r.arrayBuffer(), u8 = new Uint8Array(buf);
  const xml = u8[0] === 0x50 && u8[1] === 0x4b ? await xmlFromMxl(buf) : new TextDecoder().decode(u8);       // .mxl (zip) o .musicxml/.xml sin comprimir
  const song = parseMusicXML(xml);
  song.title = entry.titulo;  song.id = entry.id;
  song.bpm = clamp(entry.tempo || song.bpm, 40, MEL_MAXBPM);
  song.lo = Math.min(...song.notes.map((n) => n.step));  song.hi = Math.max(...song.notes.map((n) => n.step));
  return song;
}
async function openSong(i) {

  melBusy = i;  melErr = "";  dirty = true;
  try {
    const song = await readSong(e);

  } catch (err) {
    melBusy = -1;  melErr = "No se pudo abrir «" + e.titulo + "»: " + ((err && err.message) || err);
    syncHist();
  }
  dirty = true;
}

/* ---------- partida de una melodía ---------- */
function startMelody(song) {
  mel = song;  playMode = 5;  reviewOn = false;  curKey = null;  reviewPool = [];  wmap = new Map();
  layout();
  pianoPreload(song.notes.map((n) => midi(n.step) + (n.alt || 0)));
  plan = song.notes.map(() => 0);
  generated = 0;  notes = [];  lastKey = -999;
  score = streak = okCount = badCount = bestStreak = 0;
  results = [];  msg = "";  msgT = 0;  curBad = 0;  hold = null;
  let prev = null;
  for (let i = 0; i < Math.min(PENDING, song.notes.length); i++) { const n = makeNote(prev); notes.push(n); prev = n; }
  lastClef = 0;
  curShownAt = performance.now();
  pauseStart = settingsOpen ? curShownAt : null;
  kbOct = clefsOf(playMode).length === 1 && clefsOf(playMode)[0] === 1 ? 2 : 4;
  go("game");
  msg = S.melHold ? "Mantén pulsada cada nota lo que dura" : "Toca las notas de la canción";  msgOk = true;  msgT = 3.5;
}
// pulsación: la nota correcta se mantiene el tiempo que dura (la blanca más que la negra)
function melPress(idx, kb) {
  const c = currentNote();
  if (!c || hold) return;
  const good = kb ? kbOk(c, kb) : mod(c.step, 7) === (idx >= 10 ? idx - 10 : idx);
  if (!good) {                         // nota equivocada: como en el resto de modos
    badCount++;  curBad++;  streak = 0;  c.shake = 1;
    flashIdx = idx;  flashKey = kb ? kb.midi : -1;  flashT = 0.35;  flashOk = false;
    playWrong();  buzz([35, 45, 35]);
    return;
  }
  audio();  playNote(c.step, 0.5, c.alt || 0);  buzz(12);
  flashIdx = idx;  flashKey = kb ? kb.midi : -1;  flashT = 0.35;  flashOk = true;
  const need = melNeed(c);
  if (need <= 0.06) { melHoldMs = 0;  melDone = true;  submit(idx, kb);  melDone = false;  return; }
  hold = { idx, kb, t0: performance.now(), need: need * 1000, note: c };
}
function melRelease() {
  if (!hold) return;
  hold = null;  msg = "Mantén la nota pulsada más tiempo";  msgOk = false;  msgT = 1.3;  dirty = true;
}
function melTick(now) {
  if (hold && now - hold.t0 >= hold.need) {
    const h = hold;  hold = null;
    melHoldMs = h.need;  melDone = true;  submit(h.idx, h.kb);  melDone = false;
  }
}

/* ---------- figuras: negra, blanca, redonda, corchea... con puntillo ---------- */
const SHAPES = [[6, "w", 1], [4, "w", 0], [3, "h", 1], [2, "h", 0], [1.5, "q", 1], [1, "q", 0], [0.75, "e", 1], [0.5, "e", 0], [0.375, "s", 1], [0.25, "s", 0], [0.125, "t", 0]];
function shapeOf(b) {
  let best = SHAPES[5], d = 1e9;
  for (const s of SHAPES) { const e = Math.abs(s[0] - b); if (e < d) { d = e;  best = s; } }
  return best;
}
function drawShaped(step, x, col, clef, n) {
  const b = bottomStep(clef), sp = L.sp, lw = Math.max(1.2, sp * 0.1), y = stepY(step, clef);
  for (let s = b - 2; s >= step; s -= 2) { const ly = stepY(s, clef); line(x - sp, ly, x + sp, ly, col, lw); }
  for (let s = b + 10; s <= step; s += 2) { const ly = stepY(s, clef); line(x - sp, ly, x + sp, ly, col, lw); }
  const sh = shapeOf(n.beats), t = sh[1], up = step < b + 4;
  if (n.alt) drawAcc(n.alt, x - 1.9 * sp, y, sp * 0.9, col);
  ctx.save();
  ctx.translate(x, y);  ctx.rotate(-0.38);
  ctx.fillStyle = col;
  ctx.beginPath();
  if (t === "w") { ctx.ellipse(0, 0, sp * 0.74, sp * 0.5, 0, 0, Math.PI * 2);  ctx.moveTo(sp * 0.3, 0);  ctx.ellipse(0, 0, sp * 0.3, sp * 0.42, 0.95, 0, Math.PI * 2);  ctx.fill("evenodd"); }
  else if (t === "h") { ctx.ellipse(0, 0, sp * 0.66, sp * 0.47, 0, 0, Math.PI * 2);  ctx.moveTo(sp * 0.4, 0);  ctx.ellipse(0, 0, sp * 0.42, sp * 0.2, 0.9, 0, Math.PI * 2);  ctx.fill("evenodd"); }
  else { ctx.ellipse(0, 0, sp * 0.65, sp * 0.47, 0, 0, Math.PI * 2);  ctx.fill(); }
  ctx.restore();
  if (t !== "w") {                                    // plica y corchetes
    const sx = x + (up ? 1 : -1) * sp * 0.58, midY = stepY(b + 4, clef), ye = up ? Math.min(y - 3.4 * sp, midY) : Math.max(y + 3.4 * sp, midY);
    line(sx, y, sx, ye, col, Math.max(1.3, sp * 0.1));
    const fl = t === "e" ? 1 : t === "s" ? 2 : t === "t" ? 3 : 0;
    ctx.strokeStyle = col;  ctx.lineWidth = sp * 0.26;  ctx.lineCap = "round";
    for (let f = 0; f < fl; f++) {
      const ya = up ? ye + f * sp * 0.62 : ye - f * sp * 0.62, sg = up ? 1 : -1;
      ctx.beginPath();  ctx.moveTo(sx, ya);
      ctx.bezierCurveTo(sx + sp * 0.15, ya + sg * sp * 0.7, sx + sp * 1.15, ya + sg * sp * 0.95, sx + sp * 0.8, ya + sg * sp * 2.0);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
  }
  if (sh[2]) {                                        // puntillo (en el espacio, no sobre la línea)
    const dy = mod(step - b, 2) === 0 ? y - sp * 0.5 : y;
    ctx.fillStyle = col;
    ctx.beginPath();  ctx.arc(x + sp * 1.15, dy, sp * 0.17, 0, Math.PI * 2);  ctx.fill();
  }
}

function fftMag(buf, n) {                                  // magnitud del espectro de las últimas n muestras (ventana de Hann)
  const off = buf.length - n, re = new Float32Array(n), im = new Float32Array(n);
  for (let i = 0; i < n; i++) re[i] = buf[off + i] * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1)));
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { const t = re[i]; re[i] = re[j]; re[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang), h = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < h; k++) {
        const a = i + k, b = a + h, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr;  im[b] = im[a] - ti;  re[a] += tr;  im[a] += ti;
        const nc = cr * wr - ci * wi;  ci = cr * wi + ci * wr;  cr = nc;
      }

  const m = new Float32Array(n >> 1);
  for (let i = 0; i < m.length; i++) m[i] = Math.hypot(re[i], im[i]);

}

function streakInfo() {

  const today = dayIdx(Date.now());
  let cur = 0, k = days.has(today) ? today : today - 1;
  while (days.has(k)) { cur++;  k--; }
  let best = 0, run = 0, prev = null;
  for (const d of [...days.keys()].sort((a, b) => a - b)) { run = prev !== null && d === prev + 1 ? run + 1 : 1;  best = Math.max(best, run);  prev = d; }
  return { cur, best, today: days.get(today) || 0, alive: days.has(today) };
}

  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function computeStats() {
  const cut = periodCutoff(ST.period), list = sessions.filter((s) => s.t >= cut);
  const clefs = ST.clef < 0 ? [0, 1] : [ST.clef];
  const dm = new Map(), nm = new Map(), all = [];
  let ns = 0;
  for (const s of list) {
    let used = false, day = null;
    for (const e of s.n) {
      if (ST.clef >= 0 && e[0] !== ST.clef) continue;
      if (!day) {
        const k = new Date(s.t).setHours(0, 0, 0, 0);
        day = dm.get(k);
        if (!day) { day = { t: k, arr: [[], []] }; dm.set(k, day); }
      }
      used = true;
      day.arr[e[0]].push(e);  all.push(e);
      const key = e[0] + "_" + e[1];
      let a = nm.get(key);
      if (!a) { a = { clef: e[0], step: e[1], n: 0, bad: 0, ms: 0 }; nm.set(key, a); }
      a.n++;  a.bad += e[2];  a.ms += e[3];
    }
    if (used) ns++;

  SD = { clefs, days, all: aggOf(all), notes: [...nm.values()], sessions: ns, rvN: reviewInfo(clefs).nWeak };
}

/* ---------- elección de clave ---------- */
function clefCard(id, mode, x, y, w, h, top) {
  const hov = hoverBtn === id;
  ctx.fillStyle = hov ? accA(0.25) : AC.card;  rr(x, y, w, h, 12);  ctx.fill();
  ctx.strokeStyle = hov ? AC.accV : AC.edge;  ctx.lineWidth = 1.2;  ctx.stroke();
  const s = h * 0.1, cy = y + h / 2, ix = x + h * 0.15, iw = h * 0.72, cl = mode === 1 || mode === 4 ? 1 : 0;
  for (let i = 0; i < 5; i++) line(ix, cy + (i - 2) * s, ix + iw, cy + (i - 2) * s, AC.stave, 1);
  const col = AC.glyph;
  if (mode === 2) { glyph(G_CLEF, ix + s * 0.1, cy + s, col, 4 * s);  glyph(F_CLEF, ix + iw * 0.52, cy - s, col, 4 * s); }
  else if (cl === 0) glyph(G_CLEF, ix + s * 0.4, cy + s, col, 4 * s);

    const kk = keyOf(cl, S.klv[cl]), mid = bottomStep(cl) + 4;
    for (let i = 0; i < Math.min(kk.n, 3); i++) drawAcc(kk.type, ix + s * 3.5 + i * s * 1.1, cy - (kk.pos[i] - mid) * s * 0.5, s * 0.8, col);

  text(MODE_NAME[mode], tx, y + h * 0.38, clamp(h * 0.23, 15, 22), AC.txt, "left", "", x + w - tx - 40);
  text(mode === 5 ? "Toca canciones: mantén cada nota" : sub, tx, y + h * 0.68, clamp(h * 0.16, 12, 15), AC.dim, "left", "", x + w - tx - 40);

// los botones solo existen en la parte visible de la pantalla (por debajo de la barra) para que no se pulse algo oculto al hacer scroll

// paneles desplegables: 0 = líneas de sol · 1 = líneas de fa · 2 = nivel de armaduras en sol · 3 = nivel de armaduras en fa (lnT = progreso de la animación)
let lnOpen = [false, false, false, false], lnT = [0, 0, 0, 0];

}
// panel de líneas adicionales (0-4); PH = alto completo, ph = alto visible durante la animación
function lnPanel(c, x, y, w, PH, ph, top) {

function drawClefs() {
  const cx = L.cx0 + L.cw / 2;
  drawBar("Tipo de lectura", { back: "back", actions: [{ id: "open", icon: "gear" }] });
  const top = L.top + L.barH, w = Math.min(L.cw - L.m * 4, 520), x = cx - w / 2;
  const ch = clamp(L.vh * 0.1, 54, 88), grp = 18;
  let y = top + L.m * 1.5 + 14 - scrollY;
  clipRect(0, top, L.vw, L.vh - top);
  for (let m = 0; m < 6; m++) {
    if (m === 3) { text("ARMADURAS", x + 2, y + 6, 12, AC.dim, "left", "bold");  y += 24; }
    if (m === 5) { text("MELODÍAS", x + 2, y + 6, 12, AC.dim, "left", "bold");  y += 24; }
    const pi = m < 2 ? m : m >= 5 || m === 2 ? -1 : m - 1;                          // panel/botón de cada tarjeta (las mezcladas no tienen)
    if (pi >= 0) visHit("lnt_" + pi, x + w - 34, y - 20, 48, 48, top);   // se registra ANTES que la tarjeta para tener prioridad
    clefCard("mode_" + m, m, x, y, w, ch, top);
    if (pi >= 0) {
      const t = lnT[pi], s = 1 - 2 * t, yc = y + ch - 9, cc = pi < 2 ? pi : pi - 2;       // flechita: abajo = cerrado, arriba = abierto
      ctx.strokeStyle = t > 0.5 ? clefTxt(cc) : AC.chev;  ctx.lineWidth = 2;  ctx.lineCap = "round";

    y += grp;

}

/* ---------- resumen de sesión ---------- */
function delta(cur, prev, higher, dec, unit) {
  if (prev === null || prev === undefined) return null;
  const d = cur - prev;
  if (Math.abs(d) < Math.pow(10, -dec) / 2) return { t: "= igual que la anterior", c: AC.dim };
  return { t: (d > 0 ? "▲ " : "▼ ") + Math.abs(d).toFixed(dec) + unit + " vs anterior", c: (higher ? d > 0 : d < 0) ? AC.ok : AC.bad };
}
function drawSummary() {
  drawBar("Sesión completada", { back: "back", actions: [{ id: "open", icon: "gear" }] });
  const w = Math.min(L.cw - L.m * 2, 560), x = L.cx0 + (L.cw - w) / 2, cx = x + w / 2;
  const pad = clamp(w * 0.05, 14, 22), fs = clamp(w * 0.034, 12, 15);
  const btnH = clamp(L.vh * 0.07, 46, 58), nx = (playMode === 6 && sum.lec && sum.lec.done && sum.lec.next) || null;     // curso superado: botón para seguir con la siguiente etapa
  const barH = btnH * (nx ? 2 : 1) + L.m * 2 + (nx ? 10 : 0), viewBot = L.bot - barH;

  const r = sum.rec, A = sum.all, P = sum.prevAgg;

  y += fs * 1.2 + pad;
  // anillo de precisión

  ctx.lineWidth = lw;  ctx.strokeStyle = AC.trough;

  ctx.strokeStyle = accCol(A.acc);  ctx.lineCap = "round";

  ctx.lineCap = "butt";

  y = ry + R + lw / 2 + pad * 0.8;
  if (P) {
    const d = Math.round((A.acc - P.acc) * 100);
    const t = d === 0 ? "= igual que la sesión anterior" : (d > 0 ? "▲ +" : "▼ ") + d + " pts vs. sesión anterior";
    text(t, cx, y, fs, d === 0 ? AC.dim : d > 0 ? AC.ok : AC.bad, "center");
  } else text("Primera sesión de esta modalidad", cx, y, fs, AC.dim, "center");
  y += fs * 1.2 + pad;
  if (sum.lv) {                                      // armaduras: ¿se sube de nivel?
    const q = sum.lv, nt = q.pass ? (q.last ? "¡Nivel máximo superado!" : "¡Nivel superado! Subes al nivel " + (q.to + 1) + ": " + keyName(q.to) + " (" + keySym(q.to) + ")") : "Necesitas un " + Math.round(KEY_PASS * 100) + " % de precisión para subir de nivel";
    text(nt, cx, y, fs + 1, q.pass ? AC.ok : AC.mid, "center", "bold", w);
    y += fs * 1.4 + pad * 0.6;
  }
  if (sum.lec) {                                     // curso de lectura: ¿cuenta la sesión y se supera la etapa?
    const q = sum.lec;
    const nt = q.done ? (q.newlyDone ? "¡Etapa superada!" : "Etapa superada") : q.pass ? "Sesión válida: " + q.streak + " de " + q.need : "Necesitas un " + Math.round(q.thr * 100) + " % para que cuente";
    text(nt, cx, y, fs + 1, q.done || q.pass ? AC.ok : AC.mid, "center", "bold", w);

  });
  y += rrh * Math.max(1, rv.items.length) + 10 + pad;
  if (sum.rvN > 0) {
    const rbh = clamp(L.vh * 0.065, 44, 54);

  if (nx) actionBtn(x, ny, w, btnH, "Siguiente etapa · " + nx.id.replace(/^[a-z]+/, "") + " " + nx.titulo, true, hoverBtn === "s_next");
  actionBtn(x, by, bw, btnH, nx ? "Repetir" : "Nueva sesión", !nx, hoverBtn === "s_again");

/* ---------- estadísticas globales: dibujo ---------- */
function drawChart(x, y, w, h) {
  panel(x, y, w, h);
  addHit("t_chart", x, y, w, h);
  const lm = 46, rm = 16, tm = 16, bm = 28, px = x + lm, py = y + tm, pw = w - lm - rm, ph = h - tm - bm;
  const m = ST.metric, days = SD.days, per = ST.period, cut = periodCutoff(per);
  const nX = per < 2 ? (per === 0 ? 7 : 30) : Math.max(days.length, 1);
  const val = (a) => (m === 0 ? a.acc * 100 : m === 1 ? a.nps : a.n);
  const series = SD.clefs.map((c) => ({
    c,
    pts: days.map((d, i) => (d.a[c].n ? { i: per < 2 ? Math.round((d.t - cut) / 86400000) : i, v: val(d.a[c]) } : null)).filter(Boolean)
  }));
  let mx = 0;
  for (const s of series) for (const p of s.pts) mx = Math.max(mx, p.v);
  const ymax = m === 0 ? 100 : niceMax(Math.max(0.1, mx * 1.1));
  const fy = (v) => (m === 0 ? Math.round(v) + "%" : String(Math.round(v * 100) / 100));
  const fsz = 11;
  for (let g = 0; g <= 4; g++) {
    const gy = py + ph - (g / 4) * ph;
    line(px, gy, px + pw, gy, AC.grid, 1);
    text(fy((ymax * g) / 4), px - 8, gy, fsz, AC.dim, "right");
  }
  const xp = (i) => px + ((i + 0.5) / nX) * pw;
  const maxLab = Math.max(1, Math.floor(pw / 44)), stepL = Math.ceil(nX / maxLab);
  for (let i = 0; i < nX; i += stepL) {
    let dd;
    if (per < 2) { dd = new Date(cut);  dd.setDate(dd.getDate() + i); }
    else dd = new Date(days[i] ? days[i].t : cut);
    text(dd.getDate() + "/" + (dd.getMonth() + 1), xp(i), py + ph + 15, fsz, AC.dim, "center");
  }
  for (const s of series) {
    const col = clefCol(s.c);
    if (s.pts.length > 1) {
      ctx.strokeStyle = col;  ctx.lineWidth = 2.6;  ctx.lineJoin = "round";
      ctx.beginPath();
      s.pts.forEach((p, k) => { const X = xp(p.i), Y = py + ph - (p.v / ymax) * ph; if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
      ctx.stroke();
    }
    ctx.fillStyle = col;
    for (const p of s.pts) { ctx.beginPath();  ctx.arc(xp(p.i), py + ph - (p.v / ymax) * ph, 4.2, 0, Math.PI * 2);  ctx.fill(); }
  }
}
function drawStats() {

/* LEC-GEN:START ===== generador de ejercicios de la vía A (sin DOM: se prueba en Node) ===== */
const LecGen = (() => {
  const CLAVES = ["sol", "fa"];
  const mod7 = (a) => ((a % 7) + 7) % 7;
  const numDist = (obj) => { const d = {}; for (const k of Object.keys(obj)) { const w = +obj[k]; if (w > 0) d[+k] = w; } return d; };

  // Plan de claves de la sesión: una sola clave, o tramos alternos de longitud aleatoria dentro de st.tramos.
  function planClaves(st, rng) {
    const N = st.longitud || 32;
    if (st.clave === "sol") return new Array(N).fill(0);
    if (st.clave === "fa") return new Array(N).fill(1);
    const a = (st.tramos || [3, 6])[0], b = (st.tramos || [3, 6])[1], out = [];
    let c = rng() < 0.5 ? 0 : 1;
    while (out.length < N) {

      if (preferDo) { const z = opts.filter((s) => hasDo(s, s + w - 1)); if (z.length) opts = z; }
      if (avoid !== undefined && opts.length > 1) opts = opts.filter((s) => s !== avoid);

/* ===================== LECTURA A PRIMERA VISTA (cursos) ===================== */
const LEC_DIR = "cursos/";
const LEC_SCENES = ["lec", "lecnivel", "lecficha", "midichk", "dmres"];
const LEC_KEY = "rnl_prog";
let lec = { state: "idle", err: "", index: null, courses: {} };
let lecProg = {}, lecOpen = {}, lecRun = null, lecFb = null, lecDisc = false, lecConfirm = { id: "", t: 0 };
let lecSel = { course: null, stage: null };
const lecChk = { last: -1, doOk: false };

/* ---------- datos: cursos y progreso ---------- */
const lecKey = () => LEC_KEY + (S.hand ? "_" + S.hand : "");      // el progreso de cada modo (dos manos / derecha / izquierda) se guarda aparte
function lecLoadProg() {
  try { const r = JSON.parse(localStorage.getItem(lecKey()) || "{}"); lecProg = r.prog || {}; lecOpen = r.open || {}; } catch (e) { lecProg = {}; lecOpen = {}; }
}
function lecSaveProg() { try { localStorage.setItem(lecKey(), JSON.stringify({ v: 1, prog: lecProg, open: lecOpen })); } catch (e) {} }
async function lecLoad(force) {
  if (lec.state === "loading" || (lec.state === "ok" && !force)) return;
  lec.state = "loading";  lec.err = "";  dirty = true;
  try {
    const r = await fetch(LEC_DIR + "index.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("index.json " + r.status);
    const idx = await r.json(), courses = {};
    for (const c of idx.cursos) {
      const rr2 = await fetch(LEC_DIR + c.archivo, { cache: "no-cache" });
      if (!rr2.ok) throw new Error(c.archivo + " " + rr2.status);
      courses[c.id] = await rr2.json();
    }
    lec.index = idx;  lec.courses = courses;  lec.state = "ok";
  } catch (e) { lec.state = "error";  lec.err = "No se pudieron cargar los cursos (" + ((e && e.message) || e) + ")"; }
  dirty = true;
}
const lecStageFull = (course, e) => Object.assign({}, course.defectos || {}, e);
function lecHandStage(st) {                            // null = la etapa no se puede tocar con una sola mano
  if (!S.hand) return st;
  const mine = S.hand === 1 ? "sol" : "fa";
  if (st.modo === "dosManos") return null;
  if (st.clave === "sol" || st.clave === "fa") return st.clave === mine ? st : null;       // las etapas de la otra clave se saltan
  return Object.assign({}, st, { clave: mine });                                          // las de claves mezcladas se tocan solo en la clave de esa mano
}
function lecOrderA() {                                 // etapas de la vía A en orden de progresión
  const out = [];
  if (!lec.index) return out;
  for (const c of lec.index.cursos) {
    if (c.via !== "A") continue;
    const crs = lec.courses[c.id];
    if (crs) for (const e of crs.etapas) { const s2 = lecHandStage(lecStageFull(crs, e)); if (s2) out.push({ course: crs, stage: s2 }); }
  }

/* DOS-GEN:START ===== generador de columnas de dos manos (sin DOM: se prueba en Node) ===== */
const DosGen = (() => {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wts = (o) => Object.entries(o || {}).map(([k, v]) => [+k, +v]).filter((e) => e[1] > 0);
  function pick(items, rng) {
    let t = 0; for (const it of items) t += it[1];
    if (t <= 0) return 0;
    let r = rng() * t;
    for (const it of items) { r -= it[1]; if (r < 0) return it[0]; }
    return items[items.length - 1][0];
  }
  // Ventana de posición: fija = todo el registro de la mano; móvil = "anchura" notas que cambian de sitio cada "cadaNotas" columnas
  function newWin(reg, pos, rng) {
    const w = { reg, pos, starts: pos.inicios && pos.inicios.length ? pos.inicios : [reg.min], lo: reg.min, hi: reg.max, n: 0, k: -1 };
    setWin(w, rng); return w;
  }
  function setWin(w, rng) {
    if (w.pos.tipo === "movil") {
      let k; do { k = Math.floor(rng() * w.starts.length); } while (w.starts.length > 1 && k === w.k);
      w.k = k; const s0 = w.starts[k];
      w.lo = Math.max(w.reg.min, s0); w.hi = Math.min(w.reg.max, s0 + w.pos.anchura - 1);
    } else { w.lo = w.reg.min; w.hi = w.reg.max; }
    w.n = 0;
  }
  function tick(w, rng) { w.n++; if (w.pos.tipo === "movil" && w.pos.cadaNotas && w.n >= w.pos.cadaNotas) setWin(w, rng); }
  const newSt = () => ({ dir: 0, run: 0, same: 1 });
  function updSt(st, m, s) {
    if (!m) { st.same++; st.dir = 0; st.run = 0; }
    else { st.same = 1; if (s === st.dir) st.run++; else { st.dir = s; st.run = 1; } }
  }
  // Una mano: o una nota fija, o una ventana con pesos de intervalo
  function mkHand(d, rng) {
    if (d.fija != null) return { fixed: d.fija, prev: d.fija };
    const win = newWin(d.registro, d.posicion, rng), W = wts(d.intervalos);
    const anc = (d.anclas || []).filter((a) => a >= win.lo && a <= win.hi);
    return { win, W, st: newSt(), prev: anc.length ? anc[Math.floor(rng() * anc.length)] : win.lo };
  }
  function generate(stage, rng) {
    rng = rng || Math.random;
    const n = stage.longitud || 32, rel = stage.relacion, maxDir = stage.maxMismaDireccion || 0, maxRep = stage.maxRepeticiones || 0;
    const R = mkHand(stage.derecha, rng), L = mkHand(stage.izquierda, rng);

    // Intervalos que caben (con algún sentido válido). Se elige entre ellos según su peso: así las cuotas del JSON se respetan
    // aunque cerca de los bordes de la ventana algún intervalo no quepa en uno de los sentidos.
    const cand = (H, strict, only) => {
      if (H.fixed != null) return [{ m: 0, w: 1, signs: [0] }];
      const c = [];
      for (const [m, w] of H.W) {
        const signs = (m === 0 ? [0] : (only || [1, -1])).filter((s) => okHand(H, m, s, strict));
        if (signs.length) c.push({ m, w, signs });

      if (R.win) tick(R.win, rng);

      out.push({ der: R.prev, izq: L.prev });
    }
    return out;
  }
  return { generate };
})();

// Evalúa una columna: la nota más grave se asigna a la izquierda y la más aguda a la derecha (el curso no cruza manos)
function dmEvalColumna(exp, tocadas, ventana) {
  const r = { ok: false, spread: 0, mano: {} };
  const t = tocadas.slice().sort((a, b) => a.nota - b.nota);
  if (tocadas.length) { const ts = tocadas.map((x) => x.t); r.spread = Math.max(...ts) - Math.min(...ts); }
  let izq = null, der = null;
  if (t.length >= 2) { izq = t[0]; der = t[t.length - 1]; }
  else if (t.length === 1) { const n = t[0]; if (Math.abs(n.nota - exp.izquierda) <= Math.abs(n.nota - exp.derecha)) izq = n; else der = n; }
  r.mano.izquierda = { esperada: exp.izquierda, tocada: izq ? izq.nota : null, ok: !!izq && izq.nota === exp.izquierda };
  r.mano.derecha = { esperada: exp.derecha, tocada: der ? der.nota : null, ok: !!der && der.nota === exp.derecha };
  r.ok = r.mano.izquierda.ok && r.mano.derecha.ok && t.length === 2 && r.spread <= ventana;

const dmY = (g, step, clef) => (clef === "sol" ? g.ySol - (step - BOTTOM_SOL) * g.sp / 2 : g.yFa - (step - BOTTOM_FA) * g.sp / 2);
function dmNoteAt(g, step, clef, x, col) {
  const sp = g.sp, b = clef === "sol" ? BOTTOM_SOL : BOTTOM_FA, lw = Math.max(1.2, sp * 0.1), lc = AC.light ? "#2b2b2b" : "#9a9a9a";
  for (let s2 = b - 2; s2 >= step; s2 -= 2) { const ly = dmY(g, s2, clef); line(x - sp, ly, x + sp, ly, lc, lw); }
  for (let s2 = b + 10; s2 <= step; s2 += 2) { const ly = dmY(g, s2, clef); line(x - sp, ly, x + sp, ly, lc, lw); }
  const y = dmY(g, step, clef), up = step < b + 4;
  if (bravOk) { glyph(up ? QUARTER_UP : QUARTER_DOWN, x - sp * 0.59, y, col, 4 * sp); return; }
  ctx.save();  ctx.fillStyle = col;  ctx.strokeStyle = col;  ctx.lineWidth = Math.max(1.4, sp * 0.12);      // sin Bravura: cabeza elíptica y plica
  ctx.beginPath();  ctx.ellipse(x, y, sp * 0.62, sp * 0.46, -0.35, 0, 7);  ctx.fill();
  ctx.beginPath();
  if (up) { ctx.moveTo(x + sp * 0.58, y - sp * 0.1);  ctx.lineTo(x + sp * 0.58, y - sp * 3.2); } else { ctx.moveTo(x - sp * 0.58, y + sp * 0.1);  ctx.lineTo(x - sp * 0.58, y + sp * 3.2); }
  ctx.stroke();  ctx.restore();
}
function dmTrack(d, blocked, now, why) {               // el tiempo de pausa (piano desconectado o móvil en vertical) no cuenta como tiempo de lectura
  if (blocked && !d.pausedSince) { d.pausedSince = now;  clearTimeout(d.timer);  d.buf = [];  devEv("dm_pausa", { motivo: why || "?", st: d.stage.id, i: d.i }); }
  else if (!blocked && d.pausedSince) { d.tShow += now - d.pausedSince;  d.pausedSince = 0; }
}
function drawDM() {
  ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
  const d = dm;
  drawBar(d ? d.stage.id.replace(/^[a-z]+/, "") + " · " + d.stage.titulo : "Dos manos", { back: "back", actions: [{ id: "dm_reset", icon: "reset" }, { id: "open", icon: "gear" }] });
  if (!d) return;
  const g = dmLayout(), sp = g.sp, now = performance.now(), disc = !lecMidiOk(), portrait = L.vw < L.vh;
  dmTrack(d, disc || portrait, now, disc ? "desconectado" : "vertical");
  // progreso y marcador, como en la partida de una línea
  const live = d.i + (d.failedThis ? 1 : 0), acc = live ? d.firstTry / live : 1;
  const stat = "Columna " + Math.min(d.i + 1, d.n) + "/" + d.n + " | Fallos: " + d.fails + " | Precisión: " + Math.round(acc * 100) + "%";
  ctx.font = "13px system-ui,sans-serif";
  const tw = ctx.measureText(stat).width, by = g.stTop + (g.statH - 12) / 2;
  ctx.fillStyle = AC.trough;  rr(g.x0, by, g.x1 - g.x0 - tw - 14, 12, 3);  ctx.fill();
  if (d.i > 0) { ctx.fillStyle = AC.light ? AC.accV : "#e6e6e6";  rr(g.x0, by, Math.max(6, (g.x1 - g.x0 - tw - 14) * d.i / d.n), 12, 3);  ctx.fill(); }
  text(stat, g.x1, g.stTop + g.statH / 2, 13, AC.dim, "right");
  // pentagramas: las columnas de las dos manos comparten la misma x
  const ink = AC.light ? "#2b2b2b" : "#8a8a8a", cc = AC.light ? "#111111" : "#bdbdbd", lw = Math.max(1.2, sp * 0.07);
  for (const cl of ["sol", "fa"]) {
    const b = cl === "sol" ? BOTTOM_SOL : BOTTOM_FA;
    for (let k = 0; k < 5; k++) { const y = dmY(g, b + 2 * k, cl); line(g.x0 + 0.3 * sp, y, g.x1, y, ink, lw); }
  }
  line(g.x0 + 0.3 * sp, dmY(g, BOTTOM_SOL + 8, "sol"), g.x0 + 0.3 * sp, dmY(g, BOTTOM_FA, "fa"), ink, lw * 1.4);
  if (bravOk) {
    glyph(G_CLEF, g.x0 + 0.75 * sp, dmY(g, BOTTOM_SOL + 2, "sol"), cc, 4 * sp);
    glyph(F_CLEF, g.x0 + 0.75 * sp, dmY(g, BOTTOM_FA + 6, "fa"), cc, 4 * sp);
  } else { text("Sol", g.x0 + 0.75 * sp, dmY(g, BOTTOM_SOL + 2, "sol"), sp * 1.2, cc, "left", "bold");  text("Fa", g.x0 + 0.75 * sp, dmY(g, BOTTOM_FA + 6, "fa"), sp * 1.2, cc, "left", "bold"); }
  const sys = Math.floor(Math.min(d.i, d.n - 1) / g.cols), c0 = sys * g.cols, c1 = Math.min(d.n, c0 + g.cols);
  const xs = (k) => g.x0 + g.leftPad + (k - c0 + 0.5) * g.colW;
  if (d.i < d.n) {                                     // un solo recuadro cruza las dos pautas: "estas dos notas, juntas"
    const x = xs(d.i), yt = g.y0 + 1.4 * sp, yb = g.y0 + 17.6 * sp;
    ctx.fillStyle = AC.light ? "rgba(0,0,0,.07)" : "rgba(255,255,255,.12)";  rr(x - g.colW * 0.42, yt, g.colW * 0.84, yb - yt, 10);  ctx.fill();
  }
  const base = AC.light ? "#2b2b2b" : "#bdbdbd", curC = AC.light ? "#000000" : "#ffffff";
  for (let k = c0; k < c1; k++) {
    const x = xs(k), col0 = k < d.i ? AC.ok : k === d.i ? curC : base;
    const cR = k === d.i && d.handFail.derecha ? AC.bad : col0, cL = k === d.i && d.handFail.izquierda ? AC.bad : col0;
    dmNoteAt(g, d.cols[k].der, "sol", x, cR);
    dmNoteAt(g, d.cols[k].izq, "fa", x, cL);
  }
  // pie: estado del piano y qué mano falló, qué tocaste y qué era
  const fx = g.x0, fy = g.feedY, fw = g.x1 - g.x0, fh = g.feedH, fs = clamp(fh * 0.2, 12, 17);
  panel(fx, fy, fw, fh);
  const ins = lecInputs(), ok = lecMidiOk();
  ctx.fillStyle = ok ? AC.ok : AC.bad;  ctx.beginPath();  ctx.arc(fx + 16, fy + 16, 5, 0, Math.PI * 2);  ctx.fill();
  text(ok ? (ins.length ? ins[0].name || "teclado" : "modo de prueba") : "Teclado desconectado", fx + 28, fy + 16, fs - 3, AC.dim, "left", "", fw * 0.5);
  const cy = fy + fh * 0.62;
  if (disc) text("Teclado desconectado · partida en pausa", fx + fw / 2, fy + fh * 0.55, fs + 4, AC.bad, "center", "bold", fw - 24);
  else if (d.fb && !d.fb.ok) {
    const r = d.fb.r;
    if (d.fb.partial) text("Toca las dos notas a la vez", fx + fw / 2, fy + 16, fs - 1, AC.mid, "center", "bold", fw * 0.4);
    [["izquierda", "Mano izquierda", 0.25], ["derecha", "Mano derecha", 0.75]].forEach(([h, lab, px]) => {
      const m = r.mano[h], cx = fx + fw * px, hw = fw * 0.46;
      text(lab, cx, fy + fh * 0.36, fs - 2, AC.dim, "center", "", hw);
      if (m.ok) text("✓ " + midiName(m.esperada), cx, cy, fs + 4, AC.ok, "center", "bold", hw);
      else if (m.tocada == null) text("Falta la nota", cx, cy, fs + 2, AC.bad, "center", "bold", hw);
      else text("Tocaste " + midiName(m.tocada) + " · era " + midiName(m.esperada), cx, cy, fs + 2, AC.bad, "center", "bold", hw);
    });
  } else if (d.fb && d.fb.ok && now - d.fb.at < 1500) {
    text("✓ " + midiName(d.fb.exp.izquierda) + "  +  " + midiName(d.fb.exp.derecha), fx + fw / 2, fy + fh * 0.55, fs + 6, AC.ok, "center", "bold", fw - 24);
    if (now - d.fb.at < 1480) setTimeout(() => { dirty = true; }, 1500 - (now - d.fb.at) + 20);
  } else text("Toca con las dos manos las dos notas de la columna, a la vez", fx + fw / 2, fy + fh * 0.55, fs + 1, AC.dim, "center", "", fw - 24);
  if (portrait) {                                      // las dos manos solo se juegan en horizontal
    const bw = Math.min(L.cw - L.m * 4, 320), bh = 52, bx = L.cx0 + (L.cw - bw) / 2, byy = L.vh * 0.58;
    addHit("dm_rot", bx, byy, bw, bh);
    addHit("noop", 0, g.top, L.vw, L.vh - g.top);
    ctx.fillStyle = AC.bg;  ctx.fillRect(0, g.top, L.vw, L.vh - g.top);
    text("Gira el móvil", L.vw / 2, L.vh * 0.38, 26, AC.txt, "center", "bold", L.vw - 32);
    text("Las dos manos se juegan en horizontal.", L.vw / 2, L.vh * 0.46, 15, AC.dim, "center", "", L.vw - 32);
    actionBtn(bx, byy, bw, bh, "Bloquear horizontal", true, hoverBtn === "dm_rot");
  }
}

/* ---------- resultado ---------- */
function drawDmRes() {
  const d = dm, r = d && d.res;
  drawBar("Resultado", { back: "back" });
  if (!r) return;
  const top = L.top + L.barH, w = Math.min(L.cw - L.m * 4, 520), x = L.cx0 + (L.cw - w) / 2, fs = clamp(L.vh * 0.021, 12, 16);
  clipRect(0, top, L.vw, L.vh - top);
  let y = top + L.m + 8 - scrollY;
  text(d.stage.id.replace(/^[a-z]+/, "") + " · " + d.stage.titulo, x + 4, y + 8, fs + 1, AC.accT, "left", "bold", w);  y += 30;
  text(Math.round(r.acc * 100) + " %", x + 4, y + 22, clamp(L.vh * 0.1, 34, 52), r.pass ? AC.ok : AC.mid, "left", "bold");  y += 56;
  const msg = r.done ? (r.newlyDone ? "¡Etapa superada!" : "Etapa ya superada.")
    : r.pass ? "Buena sesión: llevas " + r.streak + " de " + r.need + " seguidas con al menos " + Math.round(r.thr * 100) + " %."
    : "Hace falta al menos " + Math.round(r.thr * 100) + " % para sumar sesión. Inténtalo de nuevo.";
  y = lecPara(msg, x + 4, y, w - 8, fs + 1, r.done ? AC.ok : AC.txt) + 6;
  const ch = clamp(L.vh * 0.11, 58, 74), cw2 = (w - 10) / 2, pc = (v) => Math.round(v * 100) + " %";
  statCard(x, y, cw2, ch, "Mano derecha", pc(r.hand.derecha), "columnas a la primera", AC.dim, r.hand.derecha >= r.hand.izquierda ? AC.ok : AC.txt);
  statCard(x + cw2 + 10, y, cw2, ch, "Mano izquierda", pc(r.hand.izquierda), "columnas a la primera", AC.dim, r.hand.izquierda > r.hand.derecha ? AC.ok : AC.txt);
  y += ch + 10;
  statCard(x, y, cw2, ch, "Fallos", String(r.fails), "en " + r.n + " columnas");
  statCard(x + cw2 + 10, y, cw2, ch, "Tiempo mediano", (r.ms / 1000).toFixed(1).replace(".", ",") + " s", "por columna");
  y += ch + 16;
  const bh = clamp(L.vh * 0.075, 48, 58), btn = (id, label, primary) => { actionBtn(x, y, w, bh, label, primary, hoverBtn === id);  visHit(id, x, y, w, bh, top);  y += bh + 10; };
  btn("dmres_again", "Repetir", !(r.done && r.next));
  if (r.done && r.next) btn("dmres_next", "Siguiente etapa · " + r.next.id.replace(/^[a-z]+/, ""), true);
  btn("dmres_menu", "Volver al nivel", false);
  maxScroll = Math.max(0, y + scrollY - L.vh + L.m * 2);
  if (scrollY > maxScroll) { scrollY = maxScroll;  dirty = true; }
  ctx.restore();
}

lecLoadProg();

function draw(t) {
ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
sceneHits = [];
if (settingsOpen) { drawSettings(); return; }
if (scene === "dm") { drawDM(); return; }
if (scene === "game") {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
drawBar(reviewOn ? "Repasar fallos" : playMode === 6 && lecRun ? lecRun.title : playMode === 5 && mel ? mel.title : MODE_NAME[playMode], { back: "back", actions: [{ id: "reset", icon: "reset" }, { id: "open", icon: "gear" }] });
drawHeaderDark();
drawStaff();
drawNotes();
drawMessage();
drawMicHint();
if (L.kb) drawKeyboard(); else if (L.foot) drawLecFoot(); else drawWheel();
} else {
ctx.fillStyle = AC.bg;  ctx.fillRect(0, 0, L.vw, L.vh);
if (scene === "menu") drawMenu(t);
else if (scene === "clefs") drawClefs();
else if (scene === "melodies") drawMelodies();
else if (scene === "lec") drawLec();
else if (scene === "lecnivel") drawLecNivel();
else if (scene === "lecficha") drawLecFicha();
else if (scene === "midichk") drawMidiChk();
else if (scene === "dmres") drawDmRes();
else if (scene === "summary") drawSummary();
else if (scene === "stats") drawStats();
drawUpdateBanner();
}
}
let last = performance.now(), lastW = 0, lastH = 0;
function frame(t) {
const dt = Math.min(0.05, (t - last) / 1000);
last = t;
if (innerWidth !== lastW || innerHeight !== lastH) { lastW = innerWidth;  lastH = innerHeight;  onResize(); }   // por si el sistema no avisó del cambio de tamaño
const moving = update(dt);
if (finishAt && performance.now() >= finishAt) { finishAt = 0; finishSession(); }
buildUI();
const hi = settingsOpen || scene !== "game" || L.kb ? -1 : wheelIndex(pointer);
let hb = "";
for (const b of buttons) if (hit(b, pointer)) { hb = b.id; break; }
if (hi !== hoverIdx || hb !== hoverBtn) { hoverIdx = hi; hoverBtn = hb; dirty = true; }
if (moving || dirty || trans) { drawFrame(t); dirty = false; }
requestAnimationFrame(frame);
}
function onResize() { layout(); dirty = true; }
addEventListener("resize", onResize);
addEventListener("pageshow", () => { onResize(); });
addEventListener("orientationchange", () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
document.addEventListener("fullscreenchange", onResize);
document.addEventListener("webkitfullscreenchange", onResize);
function start() {
loadSettings();
loadSessions();
layout();
syncHist();
if (S.midi) initMidi();
requestAnimationFrame(frame);
}
let booted = false;
const boot = () => {
  if (booted) return;  booted = true;
  const t0 = performance.now(), sp = document.getElementById("splash"), fill = document.getElementById("splashFill"), msgEl = document.getElementById("splashMsg");
  const setP = (p, t) => { if (fill) fill.style.width = Math.round(p * 100) + "%"; if (msgEl && t !== undefined) msgEl.textContent = t; };
  try {
    loadSettings();  if (fill) fill.style.background = AC.acc;
  } catch (e) {}          // la barra usa el color de acento elegido
  setP(0.3, "Descargando fuentes…");
  let okFont = true;
  const fontP = document.fonts && document.fonts.load
    ? document.fonts.load("40px Bravura", "\uE050\uE062\uE1D5\uE1D6").then((fs) => { okFont = !!(fs && fs.length); }, () => { okFont = false; })
    : Promise.resolve();
  Promise.race([fontP, new Promise((r) => setTimeout(r, 6000))]).then(() => {
    setP(0.85, okFont ? "Preparando…" : "No se encontró fonts/Bravura.otf: se usa una fuente de reserva");
    const wait = Math.max(0, (okFont ? 900 : 2400) - (performance.now() - t0));      // el logo se ve al menos ~1 s
    setTimeout(() => {
      start();
      setP(1, "");
      if (sp) { sp.classList.add("off");  setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 450); }
    }, wait);
  });
};
addEventListener("load", boot);
setTimeout(boot, 4000);                                    // si "load" tarda (red lenta), se arranca igualmente
</script>
<style>
@font-face {
  font-family: Bravura;
  src: url("fonts/Bravura.otf") format("opentype"), url("Fonts/Bravura.otf") format("opentype");
}
</style>
</body>
